name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: bridge-en check and Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Installs the bridge-en binary of the version go.mod requires.
      - uses: pierre10101/go-ai-bridge/.github/actions/setup-bridge-en@v0.3.0
      - name: bridge-en -check
        run: bridge-en -check features/*/
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  english:
    name: Intent and English PR comment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The only write in CI: the one bridge-en comment on the pull request.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the comment diffs each feature against the PR's base
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pierre10101/go-ai-bridge/.github/actions/setup-bridge-en@v0.3.0
      # Creates or updates the one comment marked <!-- bridge-en:pr-english -->.
      - uses: pierre10101/go-ai-bridge/.github/actions/pr-english@v0.3.0
        with:
          features: "features/*/"

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
