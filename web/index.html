<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Pick your seat, hold it for ten minutes, then confirm. Live seat maps for South African shows." />
    <meta name="theme-color" content="#6d4aff" />
    <title>Seatlane</title>
    <script>
      // Apply the saved theme before the first paint (no flash).
      try {
        var t = localStorage.getItem('seatlane-theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
